<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 998" role="img" aria-labelledby="title desc">
  <title id="title">PACE LAB</title>
  <desc id="desc">Logotipo Pace Lab com três faixas inspiradas em uma pista de corrida.</desc>
  <style>
    :root { --pace-red: #D71F2B; --pace-white: #FFFFFF; }
    .track-red { fill: var(--pace-red); }
    .track-white, .wordmark { fill: var(--pace-white); }
  </style>

  <!--
    Refined vector geometry:
    - smooth cubic Bézier curves
    - consistent visual weight and spacing
    - aligned horizontal terminals
    - no raster elements, filters, masks or embedded fonts
  -->
  <g id="symbol" shape-rendering="geometricPrecision">
    <!-- Upper lane: tapered entry and clean angled terminal -->
    <path class="track-red" d="
      M 550 401
      C 611 317, 697 262, 790 253
      C 809 251, 829 250, 850 250
      H 1130
      L 1082 302
      H 816
      C 718 302, 626 337, 550 401
      Z"/>

    <!-- Middle lane: broad accelerating curve with parallel exit -->
    <path class="track-red" d="
      M 432 577
      C 520 445, 641 351, 773 335
      C 790 333, 808 332, 827 332
      H 1072
      C 1055 352, 1035 369, 1013 383
      H 801
      C 684 384, 579 465, 489 577
      Z"/>

    <!-- Inner lane: lighter accent, controlled taper and matching curvature -->
    <path class="track-white" d="
      M 529 577
      C 595 476, 685 411, 783 409
      C 794 409, 806 409, 818 409
      H 976
      C 957 428, 936 443, 912 453
      H 795
      C 710 454, 636 502, 581 577
      Z"/>
  </g>

  <!-- Original custom wordmark retained as pure vector outlines -->
  <path id="wordmark" class="wordmark" transform="scale(10)" d="m32.4 63.2h-7.2v8.2h1.6v-2.4h5.4c1.8 0 3.4-0.8 3.4-2.9s-1.4-2.9-3.2-2.9zm-0.1 4.2h-5.5v-2.7h5.4c0.8 0 1.4 0.6 1.4 1.4s-0.6 1.3-1.3 1.3zm31.2-2.6v-1.6h-6c-2.3 0-3.9 1.4-3.9 3.7v0.7c0 2.3 1.4 3.8 3.7 3.8h6.2v-1.6h-6.1c-1 0-2.1-0.6-2.1-2.2v-0.7c0-1.5 1-2.1 2-2.1h6.2zm13.9-0.1v-1.5h-8.9v8.2h8.8v-1.6h-7.2v-1.9h6.8v-1.4h-6.8v-1.7l7.3-0.1zm12.6 4.6v-6.1h-1.6v6.3c0 1.2 0.6 1.8 1.9 1.9h6.4v-1.6h-6.4c-0.2 0-0.3-0.2-0.3-0.5zm34.4-2.3c0.3-0.3 0.9-1.4 0.4-2.4-0.4-0.9-1.2-1.4-2.6-1.4h-6.7v8.2h6.7c1.7 0 3-0.8 2.9-2.7 0-0.7-0.5-1.4-0.7-1.7zm-7.3-2.2h5.1c1.4 0 1.5 1.7 0 1.7h-5.1v-1.7zm5.2 5h-5.2v-1.9h5.2c1.4 0 1.5 1.9 0 1.9zm-76.9-6.1c-0.4-0.6-1.8-0.9-2.4 0l-5 7.7h2l4.2-6.4 4.1 6.4h2l-4.9-7.7zm61.6-0.7c-0.4 0-2 0.3-2.1 1.6l-4.9 6.8h2l4.1-6.4 4.1 6.4h2.1l-5.1-7.8c0-0.4-0.8-0.6-0.2-0.6z"/>
